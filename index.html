<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SaveAutoInfo – Find Lower Auto Insurance Rates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1a1a1a;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #1b2a4a;
    }
    .logo span { color: #2cb5c8; font-style: italic; }
    .free-call {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 2px solid #2cb5c8;
      border-radius: 28px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #2cb5c8;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .free-call:hover { background: #2cb5c8; color: #fff; }

    /* ── Progress Bar ── */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 8px;
    }
    .progress-badge {
      background: #1b2a4a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 4%;
      background: linear-gradient(90deg, #2cb5c8, #56d0df);
      border-radius: 4px;
      transition: width .4s;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 60px 24px 40px;
      max-width: 600px;
      margin: 0 auto;
    }
    .hero-pin {
      width: 36px;
      height: 36px;
      margin: 0 auto 14px;
      color: #1b2a4a;
    }
    .hero h1 {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }

    /* ── ZIP Form ── */
    .zip-form {
      max-width: 420px;
      margin: 32px auto 0;
      position: relative;
    }
    .zip-input-wrap {
      position: relative;
    }
    .zip-input-wrap input {
      width: 100%;
      height: 56px;
      border: 2px solid #e8c4c4;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 16px;
      font-family: inherit;
      color: #1a1a1a;
      outline: none;
      text-align: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .zip-input-wrap input::placeholder { color: #b0b8c4; }
    .zip-input-wrap input:focus {
      border-color: #2cb5c8;
      box-shadow: 0 0 0 3px rgba(44,181,200,.15);
    }
    .required-label {
      display: block;
      text-align: right;
      font-size: 12px;
      color: #e04a4a;
      margin-top: 4px;
      font-weight: 500;
    }
    .arrow-pointer {
      position: absolute;
      right: -50px;
      top: 10px;
      font-size: 36px;
      color: #2a5cc7;
      transform: rotate(10deg);
      animation: nudge 1.5s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
    }
    @keyframes nudge {
      0%, 100% { transform: rotate(10deg) translate(0, 0); }
      50% { transform: rotate(10deg) translate(-6px, 4px); }
    }
    @media (max-width: 520px) {
      .arrow-pointer { display: none; }
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin: 18px auto 0;
      padding: 16px 24px;
      background: #2cb5c8;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .2s;
    }
    .cta-btn:hover { background: #24a0b2; }
    .cta-btn svg { width: 20px; height: 20px; }

    /* ── Mascot Line ── */
    .mascot-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 600px;
      margin: 48px auto 0;
      padding: 0 24px;
    }
    .mascot-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .mascot-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: #4b5563;
    }
    .mascot-text .check {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      background: #2cb5c8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mascot-text .check svg { width: 12px; height: 12px; color: #fff; }



    /* ── Footer ── */
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      padding: 28px 24px 12px;
    }
    .footer-links a {
      font-size: 13px;
      color: #2cb5c8;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .footer-links a:hover { color: #1b2a4a; }
    .copyright {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      padding: 16px 24px 32px;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      .arrow-pointer { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">SaveAuto<span>Info</span></div>
    <a href="https://paychat.fuse-ad.com/tl?a=1651&amp;o=6460" class="free-call">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.13.81.36 1.6.68 2.35a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.75.32 1.54.55 2.35.68A2 2 0 0122 16.92z"/></svg>
      Free call
    </a>
  </header>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-badge">4%</div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>

  <!-- Hero -->
  <section class="hero">
    <svg class="hero-pin" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
    <h1>Enter Your Zip Code</h1>

    <div class="zip-form">
      <div class="zip-input-wrap">
        <input type="text" inputmode="numeric" maxlength="5" placeholder="Zip Code" id="zipInput" />
        <span class="arrow-pointer">↙</span>
      </div>
      <span class="required-label">Required</span>

      <a href="https://paychat.fuse-ad.com/tl?a=1651&amp;o=6460" class="cta-btn" id="ctaBtn">
        GET STARTED
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </section>

  <!-- Mascot -->
  <div class="mascot-line">
    <div class="mascot-avatar">🐶</div>
    <p class="mascot-text">
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      Tell us what car you drive and we'll look for the best rates
    </p>
  </div>



  <!-- Footer Links -->
  <nav class="footer-links">
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="terms.html">Terms &amp; Conditions</a>
  </nav>

  <p class="copyright">&copy; 2026 SaveAutoInfo LLC. All rights reserved.</p>

  <script>
    const zipInput = document.getElementById('zipInput');
    zipInput.addEventListener('input', () => {
      zipInput.value = zipInput.value.replace(/\D/g, '').slice(0, 5);
    });
  </script>
</body>
</html>
