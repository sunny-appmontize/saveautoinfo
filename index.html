<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SaveAutoInfo – Find Lower Auto Insurance Rates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1a1a1a;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #1b2a4a;
    }
    .logo span { color: #2cb5c8; font-style: italic; }
    .free-call {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 2px solid #2cb5c8;
      border-radius: 28px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #2cb5c8;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .free-call:hover { background: #2cb5c8; color: #fff; }

    /* ── Progress Bar ── */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 8px;
    }
    .progress-badge {
      background: #1b2a4a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 4%;
      background: linear-gradient(90deg, #2cb5c8, #56d0df);
      border-radius: 4px;
      transition: width .4s;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 60px 24px 40px;
      max-width: 600px;
      margin: 0 auto;
    }
    .hero-pin {
      width: 36px;
      height: 36px;
      margin: 0 auto 14px;
      color: #1b2a4a;
    }
    .hero h1 {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }

    /* ── ZIP Form ── */
    .zip-form {
      max-width: 420px;
      margin: 32px auto 0;
      position: relative;
    }
    .zip-input-wrap {
      position: relative;
    }
    .zip-input-wrap input {
      width: 100%;
      height: 56px;
      border: 2px solid #e8c4c4;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 16px;
      font-family: inherit;
      color: #1a1a1a;
      outline: none;
      text-align: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .zip-input-wrap input::placeholder { color: #b0b8c4; }
    .zip-input-wrap input:focus {
      border-color: #2cb5c8;
      box-shadow: 0 0 0 3px rgba(44,181,200,.15);
    }
    .required-label {
      display: block;
      text-align: right;
      font-size: 12px;
      color: #e04a4a;
      margin-top: 4px;
      font-weight: 500;
    }
    .arrow-pointer {
      position: absolute;
      right: -50px;
      top: 10px;
      font-size: 36px;
      color: #2a5cc7;
      transform: rotate(10deg);
      animation: nudge 1.5s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
    }
    @keyframes nudge {
      0%, 100% { transform: rotate(10deg) translate(0, 0); }
      50% { transform: rotate(10deg) translate(-6px, 4px); }
    }
    @media (max-width: 520px) {
      .arrow-pointer { display: none; }
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin: 18px auto 0;
      padding: 16px 24px;
      background: #2cb5c8;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .2s;
    }
    .cta-btn:hover { background: #24a0b2; }
    .cta-btn svg { width: 20px; height: 20px; }

    /* ── Mascot Line ── */
    .mascot-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 600px;
      margin: 48px auto 0;
      padding: 0 24px;
    }
    .mascot-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .mascot-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: #4b5563;
    }
    .mascot-text .check {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      background: #2cb5c8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mascot-text .check svg { width: 12px; height: 12px; color: #fff; }



    /* ── Footer ── */
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      padding: 28px 24px 12px;
    }
    .footer-links a {
      font-size: 13px;
      color: #2cb5c8;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .footer-links a:hover { color: #1b2a4a; }
    .copyright {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      padding: 16px 24px 32px;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      .arrow-pointer { animation: none; }
    }
  </style>
  <!-- Meta Pixel Code -->
  <script>
    !(function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod
          ? n.callMethod.apply(n, arguments)
          : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n;
      n.loaded = !0;
      n.version = "2.0";
      n.queue = [];
      t = b.createElement(e);
      t.async = !0;
      t.src = v;
      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s);
    })(
      window,
      document,
      "script",
      "https://connect.facebook.net/en_US/fbevents.js",
    );
    // init fires below in body after params are read
  </script>

</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">SaveAuto<span>Info</span></div>
    <a href="https://paychat.fuse-ad.com/tl?a=1651&amp;o=6460" class="free-call dynamic_link">

  <!-- Progress -->
  <div class="progress-wrap">

  <!-- Hero -->
  <section class="hero">
    <svg class="hero-pin" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>

  <script>

  <!-- ✅ CLEAN FUSECLICK MAPPING — uses native fields + tight sub slots -->
  <script>
    (function () {
      // ── BLOCK LOCALHOST — no real events during dev testing ────────
      var isLocal =
        ["localhost", "127.0.0.1", ""].indexOf(window.location.hostname) !== -1;

      // ── 0. HELPER — drop any unfired macro like "{fbclid}" ─────────
      function val(x) {
        return x && !/^\{.*\}$/.test(x) ? x : null;
      }

      // ── 1. READ ALL URL PARAMS ─────────────────────────────────────
      var p = new URLSearchParams(window.location.search);
      var realFbclid  = val(p.get("fbclid"));
      var affClick    = val(p.get("aff_click_id"));
      var utmSource   = val(p.get("utm_source"));
      var utmCampaign = val(p.get("utm_campaign"));
      var utmTerm     = val(p.get("utm_term"));
      var utmContent  = val(p.get("utm_content"));
      var adId        = val(p.get("ad_id"));
      var adsetId     = val(p.get("adset_id"));
      var cmpId       = val(p.get("cmp_id"));
      var placement   = val(p.get("placement"));

      // ── 2. RESOLVE FBCLID & SOURCE ─────────────────────────────────
      var finalClickId = affClick || realFbclid || null;
      // Source is ONLY set for real Facebook traffic. A clean/organic
      // visit (no fbclid, no utm_source) sends NO source — no fake "fb".
      var finalSc = utmSource || (finalClickId ? "fb" : null);

      // ── 3. BUILD fbc = fb.1.{landTimestampMs}.{fbclid} ─────────────
      var landTs  = Date.now();
      var landSec = Math.floor(landTs / 1000);
      var fbc     = finalClickId ? "fb.1." + landTs + "." + finalClickId : null;

      // ── 4. READ fbp COOKIE ─────────────────────────────────────────
      var fbpMatch = document.cookie.match(/(^|;\s*)_fbp=([^;]+)/);
      var fbp      = fbpMatch ? fbpMatch[2] : null;

      // ── 5. PIXEL INIT — after params so fbc is available ───────────
      if (!isLocal && typeof fbq === "function") {
        var initObj = {};
        if (fbc) initObj.fbc = fbc;
        if (fbp) initObj.fbp = fbp;

        fbq("init", "2532262490501051", initObj);
        fbq(
          "track",
          "PageView",
          {},
          {
            eventID:
              "pv_" +
              landSec +
              "_" +
              (finalClickId
                ? finalClickId.substring(0, 12)
                : Math.random().toString(36).substring(2, 8)),
          },
        );
      }

      // ── 6. SESSION EVENT ID — stable per visit, used for dedup ─────
      // Clean format: "btn_<fbclid20>_<ts>" with click, "btn_<ts>" without.
      var sessionEid = sessionStorage.getItem("_sai_eid");
      if (!sessionEid) {
        sessionEid =
          "btn_" +
          (finalClickId ? finalClickId.substring(0, 20) + "_" : "") +
          landTs;
        sessionStorage.setItem("_sai_eid", sessionEid);
      }

      // ── 7. STORE FULL VISIT CONTEXT for morning CAPI upload ────────
      sessionStorage.setItem(
        "_sai_visit",
        JSON.stringify({
          event_id:     sessionEid,
          fbc:          fbc,
          fbp:          fbp,
          fbclid:       finalClickId,
          land_ts_ms:   landTs,
          land_ts_sec:  landSec,
          utm_campaign: utmCampaign,
          utm_term:     utmTerm,
          utm_content:  utmContent,
          utm_source:   utmSource,
          ad_id:        adId,
          adset_id:     adsetId,
          cmp_id:       cmpId,
          placement:    placement,
          sc:           finalSc,
        }),
      );

      // ── 8. BUILD FINAL FUSECLICK URL ───────────────────────────────
      var qs = new URLSearchParams();
      qs.set("a", "1651");
      qs.set("o", "6460");

      function put(key, v) {
        if (v !== null && v !== undefined && v !== "") qs.set(key, v);
      }

      // Native FuseClick fields
      put("aff_click_id", finalClickId);
      put("sub_affid",    placement);
      put("sc",           finalSc);

      // Human-readable names (s1–s3)
      put("s1", utmCampaign);   // campaign NAME
      put("s2", utmTerm);       // adset NAME
      put("s3", utmContent);    // creative NAME

      // CAPI reconciliation data (s4–s7)
      put("s4", sessionEid);    // dedup id
      put("s5", fbc);           // facebook click cookie
      put("s6", fbp);           // facebook browser cookie
      put("s7", landSec);       // land timestamp (unix sec)

      // Machine-readable IDs (s8–s10) — stable, won't break on rename
      put("s8",  adId);         // ad ID
      put("s9",  adsetId);      // adset ID
      put("s10", cmpId);        // campaign ID

      var finalCTA = "https://paychat.fuse-ad.com/tl?" + qs.toString();

      // ── 9. ATTACH TO ALL CTA LINKS ─────────────────────────────────
      document.querySelectorAll(".dynamic_link").forEach(function (link) {
        link.href = finalCTA;

        link.addEventListener("click", function (e) {
          // Stop the browser from navigating immediately —
          // we need the pixel beacon to flush first.
          e.preventDefault();

          // Browser pixel Lead — eventID dedups against the CAPI upload
          if (!isLocal && typeof fbq === "function") {
            fbq(
              "track",
              "Lead",
              { value: 0.0, currency: "USD", predicted_ltv: 0.0 },
              { eventID: sessionEid },
            );
          }

          // Give the pixel ~250ms to flush, THEN navigate
          setTimeout(function () {
            window.location.href = finalCTA;
          }, 250);
        });
      });
    })();
  </script>
